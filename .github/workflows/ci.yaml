name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # use the current major

      - uses: pnpm/setup@v3
        with:
          require-lockfile: true # frozen-lockfile install
          cache: true

      - run: pnpm run check
